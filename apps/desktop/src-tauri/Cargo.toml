[package]
name = "wtypora-desktop"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
wtypora-document-core = { path = "../../../crates/document-core" }
rfd = "0.16"
uuid = { version = "1", features = ["v4"] }
